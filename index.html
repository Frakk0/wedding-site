<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="common.title">Lisa & Franci</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Niconne&family=Plus+Jakarta+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header>
    <nav>
      <a href="#home" data-i18n="common.home"></a>
      <a href="#story" data-i18n="common.story"></a>
      <a href="#schedule" data-i18n="common.schedule"></a>
      <a href="#faq" data-i18n="common.faq"></a>
      <a href="#gifts" data-i18n="common.gifts"></a>
      <a href="rsvp.html" data-i18n="common.rsvp"></a>
    </nav>

    <select id="language-selector">
      <option value="en">English</option>
      <option value="it">Italiano</option>
      <option value="ru">Русский</option>
    </select>
  </header>

  <main>
    <section id="home">
      <div class="hero-wrap hero-heart">
        <img class="photo heart-photo" src="images/US.png" alt="Lisa & Franci">
        <img class="title-image hero-title-overlay" src="images/Lisa&amp;Franci.png" alt="Lisa & Franci">
      </div>

      <div class="hero-wrap">
        <img class="photo" src="images/Calendar.png" alt="Save the date calendar">
        <div class="hero-caption">
          <p data-i18n="common.saveTheDateLabel"></p>
        </div>
      </div>

      <div id="countdown" class="countdown">
        <div class="countdown-unit">
          <span class="countdown-value" id="countdown-days">--</span>
          <span class="countdown-label" data-i18n="countdown.days"></span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-value" id="countdown-hours">--</span>
          <span class="countdown-label" data-i18n="countdown.hours"></span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-value" id="countdown-minutes">--</span>
          <span class="countdown-label" data-i18n="countdown.minutes"></span>
        </div>
        <div class="countdown-unit">
          <span class="countdown-value" id="countdown-seconds">--</span>
          <span class="countdown-label" data-i18n="countdown.seconds"></span>
        </div>
      </div>
    </section>

    <section id="story"></section>

    <section id="schedule"></section>

    <section id="faq"></section>

    <section id="gifts"></section>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
