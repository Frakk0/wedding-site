<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="rsvp.title">RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <header>
    <a href="index.html" data-i18n="rsvp.backToSite"></a>

    <select id="language-selector">
      <option value="en">English</option>
      <option value="it">Italiano</option>
      <option value="ru">Русский</option>
    </select>
  </header>

  <main>
    <p class="save-the-date">
      <span data-i18n="common.saveTheDateLabel"></span>
      <span data-i18n="common.saveTheDateValue"></span>
    </p>

    <h1 id="title" data-i18n="rsvp.loading"></h1>
    <p id="subtitle"></p>

    <form id="code-form" hidden>
      <label>
        <span data-i18n="rsvp.enterCode"></span>

        <input id="code-input" type="text" />
      </label>

      <button
        type="submit"
        data-i18n="rsvp.submitCode"
      ></button>
    </form>

    <p id="custom-message" hidden></p>

    <form id="rsvp-form" hidden>
      <label>
        <span data-i18n="rsvp.attending"></span>

        <select id="attending">
          <option value="yes" data-i18n="rsvp.yes"></option>
          <option value="no" data-i18n="rsvp.no"></option>
        </select>
      </label>

      <label>
        <span data-i18n="rsvp.guestCount"></span>

        <input
          id="guest-count"
          type="number"
          min="0"
          value="1"
        />
      </label>

      <label>
        <span data-i18n="rsvp.dietary"></span>

        <textarea id="dietary-notes"></textarea>
      </label>

      <label>
        <span data-i18n="rsvp.message"></span>

        <textarea id="message"></textarea>
      </label>

      <p id="status"></p>

      <button
        type="submit"
        data-i18n="rsvp.submit"
      ></button>
    </form>
  </main>

  <script type="module" src="/js/rsvp.js"></script>
</body>
</html>
